# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: arisu
description: bazzite w/kde

base-image: ghcr.io/ublue-os/bazzite   
image-version: latest
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - lionheartp/Hyprland
    install:
      packages:
        - brave-origin
        - noctalia
        - kitty
        - mpv
        - cockpit
        - android-tools
        - wlr-randr
        - python3-tkinter
        - firefox
        - openssl3-libs.i686 #gambiarra acel
        
    remove:
      packages:
        - rom-properties-utils
        - rom-properties-gtk4
        - rom-properties-localsearch3
        - rom-properties
        - rom-properties-common
        - lutris

  - type: dnf
    repos:
      cleanup: true
      enable:
        - terra
    install:
      packages:
        - umbriel-nightly
        - nwg-look
        - awww
        
  - type: files
    files:
      - source: system
        destination: /

  #- type: script
    #scripts:
      #- fix-permissions.sh
